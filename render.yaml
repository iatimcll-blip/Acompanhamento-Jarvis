services:
  - type: web
    name: jarvis-whatsapp-bridge-mcll
    runtime: docker
    rootDir: whatsapp-bridge
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: WPP_AUTH_DIR
        value: /data/.wwebjs_auth
      - key: WPP_CORS_ORIGIN
        value: https://iatimcll-blip.github.io
      - key: WPP_CLIENT_ID
        value: jarvis
    disk:
      name: whatsapp-session
      mountPath: /data
      sizeGB: 1
