name: BI Encerrados Sync

# Botão "BI ENC" do B2B Encerrados: exporta a Base de Reparos (Dashboard Geral Encerrados, B2B,
# Wellington Marcio, CMO - Reparo) e grava a base na sincronização. Ver scraper/pbi_enc_export.js.
# Não precisa de VPN — só da sessão do Power BI logada.
# - Com o secret PBI_SESSION (cookies do login, base64+gzip): roda num servidor do GitHub,
#   sem depender do PC do agente ligado. Nada da sessão vai para o repositório.
# - Sem o secret: roda no runner do PC do agente, com a sessão gravada em
#   D:\JarvisRunner\pbi-auth (node pbi_export.js --login).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pbi-enc-sync
  cancel-in-progress: false

jobs:
  onde:
    runs-on: ubuntu-latest
    outputs:
      nuvem: ${{ steps.v.outputs.nuvem }}
      pedido: ${{ steps.v.outputs.pedido }}
    steps:
      - id: v
        env:
          S: ${{ secrets.PBI_SESSION }}
          GH_TOKEN: ${{ github.token }}
        # 2026-11-26: se ESTE secret já venceu (hash em data/pbi-nuvem.json, gravado pelo agente),
        # vai direto ao PC. Quando o secret é regravado o hash muda e a nuvem volta a ser tentada.
        run: |
          echo "pedido=$(date +%s)" >> "$GITHUB_OUTPUT"
          if [ -z "$S" ]; then echo "nuvem=false" >> "$GITHUB_OUTPUT"; echo "Secret PBI_SESSION ausente: rodando no PC do agente."; exit 0; fi
          H=$(printf '%s' "$S" | sha256sum | cut -c1-16)
          V=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/${{ github.repository }}/contents/data/pbi-nuvem.json?ref=main" 2>/dev/null | jq -r '.expiradaHash // empty' 2>/dev/null || true)
          if [ -n "$V" ] && [ "$V" = "$H" ]; then echo "nuvem=false" >> "$GITHUB_OUTPUT"; echo "Secret PBI_SESSION já venceu: rodando direto no PC do agente."; else echo "nuvem=true" >> "$GITHUB_OUTPUT"; echo "Rodando na nuvem (secret PBI_SESSION presente)."; fi

  nuvem:
    needs: onde
    if: needs.onde.outputs.nuvem == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      fallback: ${{ steps.exp.outputs.fallback }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: scraper
        run: npm install
      - name: Install Chromium
        working-directory: scraper
        run: npx playwright install --with-deps chromium
      - name: Exportar do Power BI
        id: exp
        working-directory: scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: main
          PBI_SESSION: ${{ secrets.PBI_SESSION }}
          PBI_FALLBACK_PC: '1'
          PBI_AUTH_DIR: ${{ runner.temp }}/pbi-auth
          TZ: America/Sao_Paulo
        run: node pbi_enc_export.js

  # 2026-11-25: roda no PC também quando a nuvem falha (ex.: sessão do PBI_SESSION expirada)
  local:
    needs: [onde, nuvem]
    if: always() && (needs.onde.outputs.nuvem != 'true' || needs.nuvem.result == 'failure' || needs.nuvem.outputs.fallback == 'true')
    runs-on: [self-hosted, jarvis]
    timeout-minutes: 22
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: scraper
        run: npm install
      - name: Install Chromium
        working-directory: scraper
        run: npx playwright install chromium
      - name: Exportar do Power BI
        working-directory: scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: main
          PBI_AUTH_DIR: D:\JarvisRunner\pbi-auth
          PBI_PEDIDO_EM: ${{ needs.onde.outputs.pedido }}
        run: node pbi_enc_export.js
