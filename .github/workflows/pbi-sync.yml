name: BI Abertos Sync

# Botão "BI" do B2B Abertos/Swap/EVE: exporta a Base de Reparos do Power BI e entrega ao
# painel como "Anexar base geral". Ver scraper/pbi_export.js.
# Roda num servidor do GitHub (não depende do PC do agente ligado — pedido 2026-11-10).
# O Power BI é acessível pela internet (não precisa da VPN, ao contrário do Atrix).
# A sessão do Power BI vem só do secret PBI_SESSION (cookies, base64+gzip); nada dela vai pro repositório.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pbi-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scraper
        run: npm install

      - name: Install Chromium
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Exportar do Power BI
        working-directory: scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: main
          PBI_SESSION: ${{ secrets.PBI_SESSION }}
          PBI_AUTH_DIR: ${{ runner.temp }}/pbi-auth
          TZ: America/Sao_Paulo
        run: node pbi_export.js
