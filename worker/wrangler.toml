name = "atrix-trigger"
main = "atrix-trigger.js"
compatibility_date = "2024-11-01"

[vars]
GH_OWNER = "iatimcll-blip"
GH_REPO = "Acompanhamento-Jarvis"
GH_BRANCH = "main"
WORKFLOW_FILE = "atrix-sync.yml"
TICKETS_FILE = "data/atrix_tickets.json"
SYNC_STATE_FILE = "data/sync-state.json"
MIN_INTERVAL_MIN = "30"
ALLOWED_ORIGIN = "https://iatimcll-blip.github.io"

# Secrets (NUNCA colocar aqui — vão por `wrangler secret put`, ficam fora do repositório):
#   GH_TOKEN            token real do GitHub (contents:write + actions:write neste repo)
#   APP_SHARED_SECRET   segredo simples que o painel envia no header X-Atrix-Secret
